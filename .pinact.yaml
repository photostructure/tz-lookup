version: 3
min_age:
  value: 14      # days — skip Action versions published in the last 14 days
  always: true   # also verify already-pinned versions on every run, not just updates
# rules needs pinact v4; v3 ignores the key.
rules:
  # Our own actions skip the cooldown, so a release can pin a new version at once.
  - min_age: 0
    conditions:
      - expr: ActionRepoOwner == "photostructure"
