name: Stage npm Release
run-name: Stage ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: single

jobs:
  validate:
    name: Validate signed release tag
    runs-on: ubuntu-24.04
    outputs:
      package_name: ${{ steps.identity.outputs.package_name }}
      package_version: ${{ steps.identity.outputs.package_version }}
    steps:
      # Reject an operator-chosen ref before any repository content reaches disk.
      - name: Verify the release ref
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::This workflow must run at a MAJOR.MINOR.PATCH tag, not $GITHUB_REF"
            exit 1
          fi

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, package identity, and signatures
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_NAME" != "@photostructure/tz-lookup" ]]; then
            echo "::error::Unexpected package name: $PACKAGE_NAME"
            exit 1
          fi
          if [[ "$REF_NAME" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag $REF_NAME does not match package version $PACKAGE_VERSION"
            exit 1
          fi

          REF_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REF_NAME")"
          TAG_OBJECT_TYPE="$(jq -r '.object.type' <<< "$REF_JSON")"
          TAG_OBJECT_SHA="$(jq -r '.object.sha' <<< "$REF_JSON")"
          if [[ "$TAG_OBJECT_TYPE" != tag ]]; then
            echo "::error::$REF_NAME must be an annotated tag"
            exit 1
          fi

          TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA")"
          TAG_TARGET_TYPE="$(jq -r '.object.type' <<< "$TAG_JSON")"
          TAG_TARGET_SHA="$(jq -r '.object.sha' <<< "$TAG_JSON")"
          TAG_VERIFIED="$(jq -r '.verification.verified' <<< "$TAG_JSON")"
          COMMIT_VERIFIED="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
              --jq '.commit.verification.verified'
          )"

          if [[ "$TAG_TARGET_TYPE" != commit || "$TAG_TARGET_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $REF_NAME does not point directly to the workflow commit"
            exit 1
          fi
          if [[ "$TAG_VERIFIED" != true || "$COMMIT_VERIFIED" != true ]]; then
            echo "::error::The release commit and annotated tag must both have verified signatures"
            exit 1
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

  pack:
    name: Pack exact npm tarball
    runs-on: ubuntu-24.04
    needs: validate
    env:
      EXPECTED_PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
      EXPECTED_PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Pack and verify the package
        run: |
          set -euo pipefail

          mkdir package-artifact
          npm pack --json --ignore-scripts \
            --pack-destination package-artifact > package-artifact/PACK.json

          mapfile -t TARBALLS < <(
            find package-artifact -maxdepth 1 -type f -name '*.tgz'
          )
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one package tarball, found ${#TARBALLS[@]}"
            exit 1
          fi
          TARBALL="${TARBALLS[0]}"

          if [[ "$(jq 'length' package-artifact/PACK.json)" -ne 1 ]]; then
            echo "::error::npm pack did not report exactly one package"
            exit 1
          fi
          PACK_NAME="$(jq -r '.[0].name' package-artifact/PACK.json)"
          PACK_VERSION="$(jq -r '.[0].version' package-artifact/PACK.json)"
          PACK_FILENAME="$(jq -r '.[0].filename' package-artifact/PACK.json)"
          if [[ "$PACK_NAME" != "$EXPECTED_PACKAGE_NAME" ||
                "$PACK_VERSION" != "$EXPECTED_PACKAGE_VERSION" ||
                "$PACK_FILENAME" != "$(basename "$TARBALL")" ]]; then
            echo "::error::npm pack reported an unexpected package identity"
            exit 1
          fi

          EMBEDDED_PACKAGE_JSON="$(tar -xOf "$TARBALL" package/package.json)"
          EMBEDDED_NAME="$(jq -r '.name' <<< "$EMBEDDED_PACKAGE_JSON")"
          EMBEDDED_VERSION="$(jq -r '.version' <<< "$EMBEDDED_PACKAGE_JSON")"
          if [[ "$EMBEDDED_NAME" != "$EXPECTED_PACKAGE_NAME" ||
                "$EMBEDDED_VERSION" != "$EXPECTED_PACKAGE_VERSION" ]]; then
            echo "::error::The tarball contains an unexpected package identity"
            exit 1
          fi

          tar -tzf "$TARBALL" | LC_ALL=C sort > package-artifact/CONTENTS.txt
          EXPECTED_CONTENTS=$'package/LICENSE\npackage/README.md\npackage/index.d.ts\npackage/package.json\npackage/tz.js'
          if [[ "$(cat package-artifact/CONTENTS.txt)" != "$EXPECTED_CONTENTS" ]]; then
            echo "::error::The tarball contains unexpected files"
            cat package-artifact/CONTENTS.txt
            exit 1
          fi
          (
            cd package-artifact
            sha256sum -- *.tgz > SHA256SUMS
          )
      - name: Upload the exact package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.ref_name }}
          path: |
            package-artifact/*.tgz
            package-artifact/PACK.json
            package-artifact/CONTENTS.txt
            package-artifact/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  stage:
    name: Stage package on npm
    runs-on: ubuntu-24.04
    needs: [validate, pack]
    permissions:
      contents: read
      id-token: write # Exchange GitHub OIDC identity for npm staging access.
    env:
      EXPECTED_PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
      EXPECTED_PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
    steps:
      - name: Download the exact package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.ref_name }}
          path: package-artifact
      - name: Install the release Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Verify the release tag still matches
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::This workflow must run at a release tag"
            exit 1
          fi

          REF_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REF_NAME")"
          TAG_OBJECT_TYPE="$(jq -r '.object.type' <<< "$REF_JSON")"
          TAG_OBJECT_SHA="$(jq -r '.object.sha' <<< "$REF_JSON")"
          if [[ "$TAG_OBJECT_TYPE" != tag ]]; then
            echo "::error::$REF_NAME is no longer an annotated tag"
            exit 1
          fi

          TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA")"
          TAG_TARGET_TYPE="$(jq -r '.object.type' <<< "$TAG_JSON")"
          TAG_TARGET_SHA="$(jq -r '.object.sha' <<< "$TAG_JSON")"
          TAG_VERIFIED="$(jq -r '.verification.verified' <<< "$TAG_JSON")"
          COMMIT_VERIFIED="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
              --jq '.commit.verification.verified'
          )"
          if [[ "$TAG_TARGET_TYPE" != commit ||
                "$TAG_TARGET_SHA" != "$GITHUB_SHA" ||
                "$TAG_VERIFIED" != true ||
                "$COMMIT_VERIFIED" != true ]]; then
            echo "::error::Tag $REF_NAME moved or lost a verified signature"
            exit 1
          fi
      - name: Stage the npm package
        run: |
          set -euo pipefail

          (
            cd package-artifact
            sha256sum --check SHA256SUMS
          )

          mapfile -t TARBALLS < <(
            find package-artifact -maxdepth 1 -type f -name '*.tgz'
          )
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one package tarball, found ${#TARBALLS[@]}"
            exit 1
          fi
          TARBALL="${TARBALLS[0]}"

          if [[ "$(jq 'length' package-artifact/PACK.json)" -ne 1 ]]; then
            echo "::error::The artifact has an invalid npm pack report"
            exit 1
          fi
          PACK_NAME="$(jq -r '.[0].name' package-artifact/PACK.json)"
          PACK_VERSION="$(jq -r '.[0].version' package-artifact/PACK.json)"
          PACK_FILENAME="$(jq -r '.[0].filename' package-artifact/PACK.json)"

          EMBEDDED_PACKAGE_JSON="$(tar -xOf "$TARBALL" package/package.json)"
          EMBEDDED_NAME="$(jq -r '.name' <<< "$EMBEDDED_PACKAGE_JSON")"
          EMBEDDED_VERSION="$(jq -r '.version' <<< "$EMBEDDED_PACKAGE_JSON")"
          if [[ "$PACK_NAME" != "$EXPECTED_PACKAGE_NAME" ||
                "$PACK_VERSION" != "$EXPECTED_PACKAGE_VERSION" ||
                "$PACK_FILENAME" != "$(basename "$TARBALL")" ||
                "$EMBEDDED_NAME" != "$EXPECTED_PACKAGE_NAME" ||
                "$EMBEDDED_VERSION" != "$EXPECTED_PACKAGE_VERSION" ]]; then
            echo "::error::The downloaded artifact has an unexpected package identity"
            exit 1
          fi

          npm stage publish "./$TARBALL" --ignore-scripts

  github-release:
    name: Create immutable GitHub release
    runs-on: ubuntu-24.04
    needs: stage
    permissions:
      contents: write # Create the immutable GitHub release.
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::This workflow must run at a release tag"
            exit 1
          fi

          REF_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REF_NAME")"
          TAG_OBJECT_TYPE="$(jq -r '.object.type' <<< "$REF_JSON")"
          TAG_OBJECT_SHA="$(jq -r '.object.sha' <<< "$REF_JSON")"
          if [[ "$TAG_OBJECT_TYPE" != tag ]]; then
            echo "::error::$REF_NAME is no longer an annotated tag"
            exit 1
          fi

          TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA")"
          TAG_TARGET_TYPE="$(jq -r '.object.type' <<< "$TAG_JSON")"
          TAG_TARGET_SHA="$(jq -r '.object.sha' <<< "$TAG_JSON")"
          TAG_VERIFIED="$(jq -r '.verification.verified' <<< "$TAG_JSON")"
          COMMIT_VERIFIED="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
              --jq '.commit.verification.verified'
          )"
          if [[ "$TAG_TARGET_TYPE" != commit ||
                "$TAG_TARGET_SHA" != "$GITHUB_SHA" ||
                "$TAG_VERIFIED" != true ||
                "$COMMIT_VERIFIED" != true ]]; then
            echo "::error::Tag $TAG moved or lost a verified signature"
            exit 1
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes
